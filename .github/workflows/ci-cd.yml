name: Health API CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:3000/health > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start"
          cat app.log
          exit 1

      - name: Verify health endpoint
        run: |
          curl --fail http://localhost:3000/health

      - name: Show application logs
        if: always()
        run: cat app.log